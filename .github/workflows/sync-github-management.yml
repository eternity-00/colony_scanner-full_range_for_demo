name: Sync GitHub management metadata

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.json"
      - ".github/milestones.json"
      - ".github/workflows/sync-github-management.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync labels and milestones
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const labels = JSON.parse(fs.readFileSync(".github/labels.json", "utf8"));
            const milestones = JSON.parse(fs.readFileSync(".github/milestones.json", "utf8"));
            const { owner, repo } = context.repo;

            const currentLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100
            });
            const labelsByName = new Map(currentLabels.map((label) => [label.name, label]));

            for (const label of labels) {
              if (labelsByName.has(label.name)) {
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } else {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

            const currentMilestones = await github.paginate(github.rest.issues.listMilestones, {
              owner,
              repo,
              state: "all",
              per_page: 100
            });
            const milestonesByTitle = new Map(currentMilestones.map((milestone) => [milestone.title, milestone]));

            for (const milestone of milestones) {
              const existing = milestonesByTitle.get(milestone.title);
              if (existing) {
                await github.rest.issues.updateMilestone({
                  owner,
                  repo,
                  milestone_number: existing.number,
                  title: milestone.title,
                  description: milestone.description,
                  state: "open"
                });
              } else {
                await github.rest.issues.createMilestone({
                  owner,
                  repo,
                  title: milestone.title,
                  description: milestone.description
                });
              }
            }
