name: Bug
description: Unexpected behavior or regression
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - area:product
        - area:architecture
        - area:ui
        - area:backend
        - area:hardware
        - area:ai
        - area:docs
        - area:build
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device, OS, browser, build, model, or hardware state.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs / Screenshots
    validations:
      required: false
